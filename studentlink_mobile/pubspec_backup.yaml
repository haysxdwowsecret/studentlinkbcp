name: studentlink
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  sizer: ^2.0.15              # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^6.1.0       # Required for typography (replaces local fonts)
  shared_preferences: ^2.2.2 # Required for local data storage
  web: ^1.1.1
  
  # Core feature dependencies - optimized for performance
  cached_network_image: ^3.3.1
  dio: ^5.9.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  flutter_slidable: ^4.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.2.4
  web_socket_channel: ^3.0.1
  flutter_speed_dial: ^7.0.0
  
  # 🚀 SIZE OPTIMIZATION: Optional features - lazy loaded to reduce app size
  # These are only loaded when needed, reducing initial app size by ~150MB
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  file_picker: ^8.1.7
  universal_html: ^2.2.4
  http: ^1.1.0
  
  # 🚀 SIZE OPTIMIZATION: ML Kit moved to dev_dependencies for conditional loading
  # These add ~200MB to app size - only load when accessibility features are used
  # google_mlkit_text_recognition: ^0.13.1  # Moved to conditional loading
  # google_mlkit_translation: ^0.11.0       # Moved to conditional loading  
  # google_mlkit_language_id: ^0.13.0       # Moved to conditional loading
  image: ^4.1.3
  
  # Firebase for push notifications and cloud services - optimized
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  # firebase_storage: ^12.4.10  # Removed to reduce size - can be added back if needed

dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  
  # 🚀 SIZE OPTIMIZATION: ML Kit dependencies for conditional loading
  # These are only included when building with accessibility features enabled
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_translation: ^0.11.0
  google_mlkit_language_id: ^0.13.0

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/images/
  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)
  
  # CRITICAL FONTS RULE: 
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
